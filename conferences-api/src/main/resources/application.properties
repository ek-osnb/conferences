spring.application.name=conferences-api

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/conferences
spring.datasource.username=${DB_USERNAME:conferences}
spring.datasource.password=${DB_PASSWORD}

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
