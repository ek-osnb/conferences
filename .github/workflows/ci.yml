name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: conferences-api/pom.xml

      - name: Run the tests
        working-directory: conferences-api
        run: ./mvnw -B verify

      - name: Validate the Compose files
        env:
          DB_PASSWORD: ci-placeholder
          MYSQL_ROOT_PASSWORD: ci-placeholder
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f deploy/compose.vm.yaml config --quiet
          docker compose -f deploy/compose.vm-app.yaml config --quiet
          docker compose -f deploy/compose.vm-db.yaml config --quiet

      - name: Build the API image
        run: docker build --tag conferences-api:ci ./conferences-api

      - name: Build the frontend image
        run: docker build --tag conferences-frontend:ci ./frontend
